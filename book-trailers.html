<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="assets/favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><title>Book Trailers | Reader Reach</title><style>:root{--cream:#f8f3ea;--paper:#fffdf9;--brown:#3d2418;--gold:#b8893f;--muted:#76695f;--line:#e8ddd0}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--brown);font:14px Manrope,sans-serif}a{color:inherit}nav{background:var(--paper);border-bottom:1px solid var(--line)}.wrap{max-width:1180px;width:calc(100% - 40px);margin:auto}nav .wrap{min-height:80px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}nav img{width:175px;max-width:100%;display:block}nav .links{display:flex;gap:20px;flex-wrap:wrap}nav a{text-decoration:none}.links a{font-size:12px}header{padding:70px 0 35px}h1,h2,h3{font-family:'EB Garamond',Georgia,serif}h1{font-size:clamp(42px,6vw,68px);margin:0 0 10px}header p{color:var(--muted);max-width:670px;line-height:1.8}main{min-height:60vh}.controls{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin:12px 0 25px}input{font:inherit;padding:13px 16px;border:1px solid var(--line);border-radius:12px;background:white;min-width:min(340px,100%)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}.item{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0;display:flex;flex-direction:column}.item h2{font-size:25px;line-height:1.1;margin:14px 0 5px}.item p{font-size:12px;line-height:1.7;color:var(--muted);margin:5px 0 12px}.mockup{height:300px;display:grid;place-items:center}.mockup img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 10px #3d241830)}.item video{width:100%;aspect-ratio:16/9;object-fit:contain;background:#21140d;border-radius:12px}.button{display:inline-block;border:1px solid #caa877;border-radius:99px;padding:10px 17px;text-decoration:none;font-size:12px;text-align:center;margin-top:auto;background:#fffdf9;cursor:pointer;color:var(--brown)}.button:hover{background:#f5ead8}.paging{display:flex;justify-content:center;gap:12px;margin:35px 0 65px;align-items:center}.paging button{font:inherit}.status{color:var(--muted);font-size:12px}.empty{background:var(--paper);padding:30px;border-radius:15px;border:1px solid var(--line)}footer{background:#3d2418;color:#fff4e5;padding:35px 0;margin-top:60px}footer a{color:#fff4e5}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.grid{grid-template-columns:1fr}.mockup{height:350px}nav .wrap{padding:15px 0}.links{gap:10px!important}}</style></head><body><nav><div class="wrap"><a href="index.html"><img src="assets/Reader Reach Elegant Serif Wordmark.png" alt="Reader Reach"></a><div class="links"><a href="index.html">Home</a><a href="authors.html">Authors</a><a href="spotlight.html">The Book Spotlight</a><a href="book-trailers.html">Book Trailers</a><a href="reading-room.html">The Reading Room</a><a href="contact.html">Contact</a></div></div></nav><main class="wrap"><header><h1>Book Trailers</h1><p>Watch trailers selected by The Curator and discover the books behind the stories.</p></header><div class="controls"><input id="search" type="search" aria-label="Search collection" placeholder="Search trailer titles"><a href="index.html" class="button">← Back to Homepage</a></div><div id="grid" class="grid"><div class="empty">Loading…</div></div><div class="paging"><button class="button" id="prev" disabled>← Previous</button><span id="status" class="status"></span><button class="button" id="next">Next →</button></div></main><footer><div class="wrap">Reader Reach · Every Book Has Its Readers · <a href="index.html">Home</a></div></footer><script>const db=window.supabase.createClient("https://bublmnfhyyrefcdkloak.supabase.co","sb_publishable_-bqN7xBRoMoOsueGOmA0sw_0n6GbXtY");const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safeUrl=x=>{try{const u=new URL(x,location.href);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}};const PER=12;let page=0,term='';const grid=document.getElementById('grid'),status=document.getElementById('status');async function names(ids){if(!ids.length)return new Map();const r=await db.from('authors').select('id,author_name').eq('status','approved').in('id',ids);if(r.error)throw r.error;return new Map((r.data||[]).map(a=>[a.id,a.author_name]));}async function approved(ids){if(!ids.length)return[];const r=await db.from('books').select('id,title,author_id,description,genre_topic,mockup_url,status').eq('status','approved').in('id',ids);if(r.error)throw r.error;return r.data||[];}function renderBook(b,n){return `<article class="item"><div class="mockup">${safeUrl(b.mockup_url)?`<img loading="lazy" src="${esc(safeUrl(b.mockup_url))}" alt="3D mockup for ${esc(b.title)}">`:`<h2>${esc(b.title)}</h2>`}</div><h2>${esc(b.title)}</h2><p>By ${esc(n.get(b.author_id)||'Reader Reach Author')}</p><p>${esc(b.genre_topic||'Book')}</p><a class="button" href="book.html?id=${encodeURIComponent(b.id)}">View Book →</a></article>`}function renderTrailer(t,b,n){return `<article class="item">${safeUrl(t.trailer_url)?`<video controls preload="none" playsinline poster="${esc(safeUrl(b.mockup_url))}"><source src="${esc(safeUrl(t.trailer_url))}"></video>`:`<div class="empty">Video unavailable</div>`}<h2>${esc(t.title||b.title)}</h2><p>By ${esc(n.get(b.author_id)||'Reader Reach Author')}</p><p>${esc(t.description||b.description||'')}</p><a class="button" href="book.html?id=${encodeURIComponent(b.id)}">View Book →</a></article>`}async function run(){grid.innerHTML='<div class="empty">Loading…</div>';try{await load();}catch(e){console.error(e);grid.innerHTML='<div class="empty">Unable to load the collection. Please try again later.</div>';status.textContent='';}}document.getElementById('prev').onclick=()=>{if(page>0){page--;run()}};document.getElementById('next').onclick=()=>{page++;run()};document.getElementById('search').addEventListener('input',e=>{term=e.target.value.trim().toLowerCase();page=0;run()});function finish(items,hasMore){grid.innerHTML=items.length?items.join(''):'<div class="empty">No matching items found.</div>';document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=!hasMore;status.textContent=`Page ${page+1}`;}async function load(){let q=db.from('book_trailers').select('id,book_id,trailer_url,title,description,created_at,show_on_homepage').order('created_at',{ascending:false});if(term)q=q.ilike('title',`%${term.replace(/[%_,]/g,'')}%`);let r=await q.range(page*PER,(page+1)*PER);if(r.error)throw r.error;let ts=r.data||[],bs=await approved([...new Set(ts.map(t=>t.book_id).filter(Boolean))]),bm=new Map(bs.map(b=>[b.id,b])),ns=await names([...new Set(bs.map(b=>b.author_id).filter(Boolean))]);finish(ts.filter(t=>bm.has(t.book_id)).slice(0,PER).map(t=>renderTrailer(t,bm.get(t.book_id),ns)),ts.length>PER);}run();</script></body></html>
