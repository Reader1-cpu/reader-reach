<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password | Reader Reach</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --cream:#f7f1e8;
      --paper:#fffdf9;
      --brown:#3f2a1f;
      --warm:#7a5138;
      --gold:#b9985a;
      --line:#e4d8c9;
      --muted:#75695f;
      --danger:#9a3d32;
      --success:#416b4c;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      min-height:100vh;
      background:var(--cream);
      color:var(--brown);
      font-family:Georgia, "Times New Roman", serif;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .page{
      width:100%;
      max-width:460px;
    }

    .brand{
      text-align:center;
      margin-bottom:28px;
    }

    .brand h1{
      font-size:32px;
      letter-spacing:.02em;
      margin-bottom:7px;
    }

    .brand p{
      color:var(--muted);
      font-family:Arial, sans-serif;
      font-size:14px;
    }

    .card{
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:20px;
      padding:34px;
      box-shadow:0 14px 40px rgba(63,42,31,.08);
    }

    .card h2{
      font-size:26px;
      margin-bottom:10px;
    }

    .intro{
      color:var(--muted);
      line-height:1.6;
      margin-bottom:25px;
      font-family:Arial, sans-serif;
      font-size:14px;
    }

    label{
      display:block;
      margin:0 0 8px;
      font-family:Arial, sans-serif;
      font-size:13px;
      font-weight:700;
      color:var(--brown);
    }

    input{
      width:100%;
      padding:13px 14px;
      border:1px solid var(--line);
      border-radius:10px;
      background:#fff;
      color:var(--brown);
      font-size:15px;
      outline:none;
      margin-bottom:18px;
    }

    input:focus{
      border-color:var(--gold);
      box-shadow:0 0 0 3px rgba(185,152,90,.12);
    }

    button{
      width:100%;
      border:0;
      border-radius:10px;
      padding:14px 18px;
      background:var(--brown);
      color:#fff;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
      transition:.2s ease;
    }

    button:hover{
      background:#2e1d15;
      transform:translateY(-1px);
    }

    button:disabled{
      opacity:.6;
      cursor:not-allowed;
      transform:none;
    }

    .message{
      display:none;
      margin-top:18px;
      padding:12px 14px;
      border-radius:10px;
      font-family:Arial, sans-serif;
      font-size:13px;
      line-height:1.5;
    }

    .message.error{
      display:block;
      background:#f8e9e6;
      color:var(--danger);
      border:1px solid #e7c5bf;
    }

    .message.success{
      display:block;
      background:#eaf3ec;
      color:var(--success);
      border:1px solid #c8ddce;
    }

    .back{
      text-align:center;
      margin-top:20px;
      font-family:Arial, sans-serif;
      font-size:13px;
    }

    .back a{
      color:var(--warm);
      text-decoration:none;
      font-weight:700;
    }

    .back a:hover{
      text-decoration:underline;
    }

    .hidden{
      display:none !important;
    }

    @media(max-width:520px){
      .card{
        padding:25px 20px;
      }

      .brand h1{
        font-size:28px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="brand">
      <h1>Reader Reach</h1>
      <p>A place for books, authors, and readers.</p>
    </div>

    <section class="card">

      <!-- Request reset -->
      <div id="requestSection">

        <h2>Forgot your password?</h2>

        <p class="intro">
          Enter the email address connected to your Reader Reach account.
          We’ll send you a secure password-reset link.
        </p>

        <form id="requestForm">

          <label for="email">Email address</label>

          <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
          >

          <button id="requestButton" type="submit">
            Send Reset Link
          </button>

        </form>

        <div id="requestMessage" class="message"></div>

      </div>


      <!-- Set new password -->
      <div id="passwordSection" class="hidden">

        <h2>Create a new password</h2>

        <p class="intro">
          Choose a new password for your Reader Reach account.
        </p>

        <form id="passwordForm">

          <label for="newPassword">New password</label>

          <input
            id="newPassword"
            type="password"
            autocomplete="new-password"
            minlength="8"
            placeholder="At least 8 characters"
            required
          >

          <label for="confirmPassword">Confirm new password</label>

          <input
            id="confirmPassword"
            type="password"
            autocomplete="new-password"
            minlength="8"
            placeholder="Enter the password again"
            required
          >

          <button id="passwordButton" type="submit">
            Update Password
          </button>

        </form>

        <div id="passwordMessage" class="message"></div>

      </div>


      <div class="back">
        <a href="admin.html">Back to Admin Login</a>
      </div>

    </section>

  </main>


  <script>
    const SUPABASE_URL =
      'https://bublmnfhyyrefcdkloak.supabase.co';

    const SUPABASE_PUBLISHABLE_KEY =
      'sb_publishable_-bqN7xBRoMoOsueGOmA0sw_0n6GbXtY';

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    const requestSection =
      document.getElementById('requestSection');

    const passwordSection =
      document.getElementById('passwordSection');

    const requestForm =
      document.getElementById('requestForm');

    const passwordForm =
      document.getElementById('passwordForm');

    const requestButton =
      document.getElementById('requestButton');

    const passwordButton =
      document.getElementById('passwordButton');

    const requestMessage =
      document.getElementById('requestMessage');

    const passwordMessage =
      document.getElementById('passwordMessage');


    function showMessage(element, message, type){
      element.textContent = message;
      element.className = 'message ' + type;
    }


    function clearMessage(element){
      element.textContent = '';
      element.className = 'message';
    }


    function showPasswordForm(){
      requestSection.classList.add('hidden');
      passwordSection.classList.remove('hidden');
    }


    function showRequestForm(){
      passwordSection.classList.add('hidden');
      requestSection.classList.remove('hidden');
    }


    /*
      Supabase can deliver password-recovery links through
      the URL hash. This listener also handles the recovery
      event when Supabase establishes the recovery session.
    */
    supabaseClient.auth.onAuthStateChange(
      async (event) => {

        if(event === 'PASSWORD_RECOVERY'){
          showPasswordForm();
        }

      }
    );


    /*
      Check whether this page was opened from a recovery link.
      Supabase uses the URL hash for the recovery session.
    */
    async function checkRecoverySession(){

      const hash =
        window.location.hash || '';

      const search =
        window.location.search || '';

      const recoveryLink =
        hash.includes('access_token=') ||
        hash.includes('type=recovery') ||
        search.includes('code=');

      if(!recoveryLink){
        return;
      }

      /*
        Give Supabase a moment to process the recovery
        session from the URL.
      */
      await new Promise(resolve =>
        setTimeout(resolve, 700)
      );

      const {
        data: sessionData
      } = await supabaseClient.auth.getSession();

      if(sessionData && sessionData.session){
        showPasswordForm();
      }

    }


    /*
      Request password-reset email.
    */
    requestForm.addEventListener(
      'submit',
      async (event) => {

        event.preventDefault();

        clearMessage(requestMessage);

        const email =
          document
            .getElementById('email')
            .value
            .trim();

        if(!email){
          showMessage(
            requestMessage,
            'Please enter your email address.',
            'error'
          );
          return;
        }

        requestButton.disabled = true;
        requestButton.textContent = 'Sending...';

        const redirectTo =
          window.location.origin +
          window.location.pathname;

        const {
          error
        } = await supabaseClient.auth.resetPasswordForEmail(
          email,
          {
            redirectTo
          }
        );

        requestButton.disabled = false;
        requestButton.textContent = 'Send Reset Link';

        if(error){

          showMessage(
            requestMessage,
            error.message,
            'error'
          );

          return;
        }

        showMessage(
          requestMessage,
          'If an account exists for that email, a password-reset link has been sent. Check your inbox and spam folder.',
          'success'
        );

      }
    );


    /*
      Update the password after the user opens
      the recovery link.
    */
    passwordForm.addEventListener(
      'submit',
      async (event) => {

        event.preventDefault();

        clearMessage(passwordMessage);

        const newPassword =
          document
            .getElementById('newPassword')
            .value;

        const confirmPassword =
          document
            .getElementById('confirmPassword')
            .value;

        if(newPassword.length < 8){

          showMessage(
            passwordMessage,
            'Your new password must be at least 8 characters.',
            'error'
          );

          return;
        }

        if(newPassword !== confirmPassword){

          showMessage(
            passwordMessage,
            'The passwords do not match.',
            'error'
          );

          return;
        }

        passwordButton.disabled = true;
        passwordButton.textContent = 'Updating...';

        const {
          error
        } = await supabaseClient.auth.updateUser({
          password: newPassword
        });

        passwordButton.disabled = false;
        passwordButton.textContent = 'Update Password';

        if(error){

          showMessage(
            passwordMessage,
            error.message,
            'error'
          );

          return;
        }

        showMessage(
          passwordMessage,
          'Your password has been updated successfully. You can now sign in with your new password.',
          'success'
        );

        setTimeout(() => {
          window.location.href = 'admin.html';
        }, 1800);

      }
    );


    checkRecoverySession();
  </script>

</body>
</html>
